name: imghost finite Node seccomp IPC bridge
on:
  push:
    branches: ['prep/qualification/imghost-node-seccomp-bridge-20261006']
    paths: ['.github/workflows/imghost-node-seccomp-bridge.yml']
permissions:
  contents: read
concurrency:
  group: imghost-node-seccomp-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  node-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard resources and materialize pinned no-product probes
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import base64,hashlib,json,os,shutil,time
          from pathlib import Path
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          assert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted' and os.geteuid()!=0
          root=Path(os.environ['RUNNER_TEMP'])/'node-seccomp-bridge-materials'
          disk=shutil.disk_usage(root.parent).free
          memory=next(int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))
          assert disk>=10*1024**3 and memory>=3*1024**3
          print(json.dumps({'kind':'NODE_BRIDGE_SETUP_PREFLIGHT','disk_free_bytes':disk,'available_ram_bytes':memory,'limits':'Private probes estimated <=1MiB; setup-node reuse preferred, download/unpack peak estimate <=1GiB, not measured peak. No local install or product dependencies.'}),flush=True)
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          rows=json.loads('[{"name":"control.py","bytes":10283,"sha256":"ca1ea8ac683095c7769fb1b668db8cae22d99a9f893f69ba9d2b7641e3a1b6e8","base64":""},{"name":"owned_runner.py","bytes":7445,"sha256":"875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303","base64":""},{"name":"bridge.py","bytes":1424,"sha256":"3a2669576ea73b0f9f411b546c617d64537e59255436f50a819bcd4ff103fe0c","base64":""},{"name":"probe.cjs","bytes":3771,"sha256":"d4ada6931d492fdf0275bc006af9dc03a8bb69f5964279a89f2bf789622cb389","base64":""},{"name":"driver.py","bytes":4689,"sha256":"876724fff93e06790fa0de83c746234159ffbee72ff8efb1ae53ed98ddc36c3e","base64":""}]')
          for row in rows:
           raw=base64.b64decode(row['base64'],validate=True)
           assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
           with (root/row['name']).open('xb') as f:f.write(raw)
           print(json.dumps({'kind':'NODE_BRIDGE_SOURCE_PIN','name':row['name'],'bytes':len(raw),'sha256':row['sha256']}),flush=True)
          PY
      - name: Reuse or set up exact public Node runtime without package cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          architecture: x64
          check-latest: false
          token: ''
      - name: Qualify four fixed synthetic Node process and IPC shapes only
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 "$RUNNER_TEMP/node-seccomp-bridge-materials/driver.py"
