name: Git39-42-43 full tracked source materialization v2 only
on:
  push:
    branches: ['prep/qualification/git39-42-43-fullsource-materialization-v2-20261007']
    paths: ['.github/workflows/git39-42-43-fullsource-materialization-v2.yml']
permissions:
  contents: read
concurrency:
  group: git39-42-43-fullsource-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize hash-pinned source controls without checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          from pathlib import Path
          import os,base64,hashlib
          root=Path(os.environ['RUNNER_TEMP'])/'git39-42-43-fullsource-v2-bootstrap'
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          materials={'controller.py': '', 'owned_runner.py': '', 'coupled.swift': '', 'epoch.swift': '', 'fulltree_materializer.py': ''}
          digests={'controller.py': '82c6d9e2cd3ba75b733e45d65884e3b61e47db015a96b9ae4c008db64f36d46f', 'owned_runner.py': '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303', 'coupled.swift': '8836c77a44edab794b158e72cae6f03b34417d26543946be8b68e928f139a24d', 'epoch.swift': 'd374c4928139e23c6a080fa30aa5092cdc424cd66fb2b6187b63d3abdf8047d4', 'fulltree_materializer.py': '5bdf24d3aa22087fc34d38fd67b24d18f8dee91187d65d722448000ec948c90c'}
          for name,value in materials.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==digests[name]
              with (root/name).open('xb') as f: f.write(raw)
          PY
      - name: Acquire full source objects and verify the exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -S "$RUNNER_TEMP/git39-42-43-fullsource-v2-bootstrap/controller.py"
