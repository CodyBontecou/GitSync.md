name: XCTest

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xctest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: SyncMDTests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_PROJECT: Sync.md.xcodeproj
      XCODE_SCHEME: Sync.md
      TEST_TARGET: SyncMDTests
    steps:
      - uses: actions/checkout@v4

      - name: Select iPhone simulator (newest runtime)
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          # Pick an iPhone from the newest installed runtime. The iOS 26.2
          # simruntime libswift_Concurrency.dylib aborts with "pointer being
          # freed was not allocated" during TaskLocal scope teardown on task
          # deinit; newer runtimes are unaffected.
          SELECT="$(xcrun simctl list devices available | python3 -c '
          import sys
          best = None
          runtime = None
          for line in sys.stdin:
              stripped = line.strip()
              if stripped.startswith("--") and "iOS" in stripped and stripped.endswith("--"):
                  parts = stripped.strip("- ").split()
                  runtime = tuple(int(x) for x in parts[-1].split("."))
                  continue
              if runtime and "iPhone" in line and "(" in line and ")" in line:
                  udid = line[line.find("(") + 1 : line.find(")")]
                  if len(udid) == 36 and (best is None or runtime > best[0]):
                      best = (runtime, udid)
          if best:
              ver = ".".join(str(x) for x in best[0])
              print(best[1] + "|" + ver)
          ')"
          SIMULATOR_UDID="${SELECT%%|*}"
          RUNTIME="${SELECT##*|}"
          if [ -z "${SIMULATOR_UDID:-}" ] || [ "$SIMULATOR_UDID" = "$SELECT" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIMULATOR_UDID (runtime iOS $RUNTIME)"

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run unit XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:"$TEST_TARGET" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Audit Release app resources
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DERIVED_DATA="$RUNNER_TEMP/ReleaseDerivedData"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RELEASE_DERIVED_DATA"

          APP_PATH="$RELEASE_DERIVED_DATA/Build/Products/Release-iphonesimulator/Sync.md.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"

          if find "$APP_PATH" -type f -name '*.storekit' -print -quit | grep -q .; then
            echo "::error::Local StoreKit configuration must not ship in the Release app"
            exit 1
          fi
