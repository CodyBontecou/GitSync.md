name: imghost PR10 frozen backend pair original208 compatibility and audits
on:
  push:
    branches: ['prep/qualification/imghost-pr10-backend-pair-20261006']
    paths: ['.github/workflows/imghost-pr10-backend-pair.yml']
permissions:
  contents: read
concurrency:
  group: imghost-pr10-backend-pair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMGHOST_PR: '10'
      IMGHOST_SOURCE_HEAD: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
    steps:
      - name: Cloud resource admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          /usr/bin/python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.geteuid()!=0
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA'] and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert shutil.disk_usage('/').free>=10*1024**3
          assert next(int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines()if x.startswith('MemAvailable:'))>=3*1024**3
          PY
      - name: Checkout exact complete backend and unchanged root manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/
      - name: Exact reused public Node runtime without package cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          architecture: x64
          check-latest: false
          token: ''
      - name: Materialize pinned PR10 controller and exact previously qualified pair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import ast,base64,hashlib,json,os,urllib.request
          from pathlib import Path
          rows=json.loads('[{"name":"imghost-vitest-controller.py","bytes":18882,"sha256":"056ab2078fb600a311ba6e6e95307980dd03cbdd01f0c438a82fc0f5f54e5c54","base64":""},{"name":"imghost-vitest-expected-names.json","bytes":27596,"sha256":"620461f166dc886965147ed116425a5888a36d961e845e05de19f968b27f2efb","base64":""},{"name":"owned_runner.py","bytes":7445,"sha256":"875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303","base64":""},{"name":"pr10-driver.py","bytes":7086,"sha256":"81d5110e26008f06b4d97616f619c1f38d68c9200b63ae40291af6c8de76db9f","base64":""}]')
          root=Path(os.environ['RUNNER_TEMP'])
          for row in rows:
           raw=base64.b64decode(row['base64'],validate=True)
           assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
           with (root/row['name']).open('xb')as f:f.write(raw)
           print('PR10_PAIR_SOURCE '+json.dumps({k:r for k,r in row.items()if k!='base64'}),flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):raise RuntimeError('source redirect refused STOP')
          url='https://api.github.com/repos/CodyBontecou/isome/git/blobs/4aed7444e251557db87e04893e80453b7917750d'
          op=urllib.request.build_opener(NoRedirect)
          with op.open(urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Accept-Encoding':'identity'}),timeout=20)as response:
           assert response.status==200 and response.geturl()==url and response.headers.get('Content-Encoding')in(None,'identity')
           length=response.headers.get('Content-Length');assert length is None or 0<int(length)<=524288
           body=response.read(524288);assert (length is None and 0<len(body)<524288)or(length is not None and len(body)==int(length))
          v=json.loads(body);assert v['sha']=='4aed7444e251557db87e04893e80453b7917750d' and v['encoding']=='base64'
          w=base64.b64decode(v['content'].replace('\n',''),validate=True)
          assert len(w)==349654 and v['size']==len(w) and hashlib.sha256(w).hexdigest()=='341b4aac6045af78ceed68e68a0f2de35de2a7789b43e67a58d45bd95429dc67'
          assert hashlib.sha1(b'blob '+str(len(w)).encode()+b'\0'+w).hexdigest()==v['sha']
          lines=[l for l in w.decode().splitlines()if l.startswith('          rows=')];assert len(lines)==1
          entries=ast.literal_eval(lines[0].strip().split('=',1)[1]);assert len(entries)==6
          wanted=json.loads('{"imghost-wrangler-baseline-package.json":{"bytes":2276,"sha256":"50c92f15b750e9554fedae70434c63eea8932dc7b642d1f7cd45942f27af5552"},"imghost-wrangler-baseline-lock.json":{"bytes":100339,"sha256":"2b41d0c2c4068aa73f83c8c19b103670e95941021a8b6ffe952ca5beec209c67"},"imghost-wrangler-candidate-package.json":{"bytes":2276,"sha256":"bf169a806cfe5c35f48e4fcb87de59ed93fe1b6e8a7436d18dcb4761c3105ebc"},"imghost-wrangler-candidate-lock.json":{"bytes":97236,"sha256":"ec03e1e46112328f46cd345f9f564afd7b305798de4c4e0c60d6a299cc3089d5"}}')
          selected=[]
          for row in entries:
           if row['name'] not in wanted:continue
           assert {k:row[k]for k in ('bytes','sha256')}==wanted[row['name']]
           raw=base64.b64decode(row['base64'],validate=True)
           assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
           with(root/row['name']).open('xb')as f:f.write(raw)
           selected.append(row['name'])
           print('PR10_PAIR_REUSED '+json.dumps({k:r for k,r in row.items()if k!='base64'}),flush=True)
          assert set(selected)==set(wanted) and len(selected)==4
          PY
      - name: Finite exact installation full original208 tests and keyed audits
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 "$RUNNER_TEMP/pr10-driver.py"
