name: Git39-42-43 five-case full tracked source materialization only
on:
  push:
    branches: ['prep/qualification/git39-42-43-fivecase-fullsource-20261007']
    paths: ['.github/workflows/git39-42-43-fivecase-fullsource.yml']
permissions:
  contents: read
concurrency:
  group: git39-42-43-fivecase-fullsource-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize hash-pinned source controls without checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          from pathlib import Path
          import os,base64,hashlib
          root=Path(os.environ['RUNNER_TEMP'])/'git39-42-43-fivecase-fullsource-bootstrap'
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          materials={'controller.py': '', 'owned_runner.py': '', 'coupled.swift': '', 'epoch.swift': '', 'fulltree_materializer.py': '', 'background.swift': ''}
          digests={'controller.py': 'a54773128184aea185229a9a64e3202c105031191236d692f4b4e47f607ef7d7', 'owned_runner.py': '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303', 'coupled.swift': '8836c77a44edab794b158e72cae6f03b34417d26543946be8b68e928f139a24d', 'epoch.swift': 'd374c4928139e23c6a080fa30aa5092cdc424cd66fb2b6187b63d3abdf8047d4', 'fulltree_materializer.py': 'd368476e44a18734a75c001b93cabd446350986f76c10a006305de8cb268dc1f', 'background.swift': 'b1992656a2a68302e506e1e179e2e194a94224dc3a356e740bc30cd690d09e1c'}
          for name,value in materials.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==digests[name]
              with (root/name).open('xb') as f: f.write(raw)
          PY
      - name: Acquire full source objects and verify the exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -S "$RUNNER_TEMP/git39-42-43-fivecase-fullsource-bootstrap/controller.py"
