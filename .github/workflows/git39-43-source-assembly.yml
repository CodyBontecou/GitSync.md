name: Git39-43 source assembly only
on:
  push:
    branches: ['prep/qualification/git39-43-source-assembly-20261006']
    paths: ['.github/workflows/git39-43-source-assembly.yml']
permissions:
  contents: read
concurrency:
  group: git39-43-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize hash-pinned source controls without checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,hashlib
          root=Path(os.environ['RUNNER_TEMP'])/'git39-43-source-bootstrap'
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          materials={'controller.py': '', 'owned_runner.py': '', 'coupled.swift': ''}
          digests={'controller.py': 'e27154f170778db9c7304bfdda1bd5a9d28bc6e3fbbac9152303f028bd4e5af3', 'owned_runner.py': '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303', 'coupled.swift': '8836c77a44edab794b158e72cae6f03b34417d26543946be8b68e928f139a24d'}
          for name,value in materials.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==digests[name]
              with (root/name).open('xb') as f: f.write(raw)
          PY
      - name: Merge source objects and retain original test identities
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/git39-43-source-bootstrap/controller.py"
