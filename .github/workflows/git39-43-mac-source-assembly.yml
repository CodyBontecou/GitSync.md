name: Git39-43 Mac source-only assembly qualification
on:
  push:
    branches: ['prep/qualification/git39-43-mac-source-assembly-20261006']
    paths: ['.github/workflows/git39-43-mac-source-assembly.yml']
permissions:
  contents: read
concurrency:
  group: qualification-git39-43-mac-source-assembly-20261006
  cancel-in-progress: false
jobs:
  mac-source-only:
    name: Mac OS-Git source assembly (no compiler or native tests)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Fixed private source-only qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import re
          import sys
          
          branch = 'refs/heads/prep/qualification/git39-43-mac-source-assembly-20261006'
          assert (os.environ.get('GITHUB_ACTIONS') == 'true'
                  and os.environ.get('RUNNER_OS') == 'macOS'
                  and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
                  and os.environ.get('GITHUB_REPOSITORY') == 'CodyBontecou/GitSync.md'
                  and os.environ.get('GITHUB_EVENT_NAME') == 'push'
                  and os.environ.get('GITHUB_RUN_ATTEMPT') == '1'
                  and os.environ.get('GITHUB_REF') == branch
                  and re.fullmatch('[0-9a-f]{40}', os.environ.get('GITHUB_SHA', '')) is not None
                  and os.environ.get('GITHUB_SHA') == os.environ.get('GITHUB_WORKFLOW_SHA')), 'first fixed Mac source push only'
          PAYLOADS = {"controller.py":{"base64":"","bytes":12896,"sha256":"4ac29c6bbb2ae4b3dff357394ac8d9552d0c25c265766ac3cf357d550a00fb35"},"coupled.swift":{"base64":"","bytes":4541,"sha256":"8836c77a44edab794b158e72cae6f03b34417d26543946be8b68e928f139a24d"},"driver.py":{"base64":"","bytes":8103,"sha256":"12e3e81e12dcff4f69c1d1a87a1ee9e0d2f0275e97e6d0f2eff989c2d6db92f9"},"owned_runner.py":{"base64":"","bytes":7443,"sha256":"5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af"}}
          
          assert set(PAYLOADS) == {'controller.py', 'owned_runner.py', 'coupled.swift', 'driver.py'}
          assert sum(row['bytes'] for row in PAYLOADS.values()) <= 65536
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert root.is_dir()
          material = root / 'git39-43-mac-source-material'
          assert not material.exists() and not material.is_symlink(), 'fresh private material only'
          material.mkdir(mode=0o700)
          for name, row in PAYLOADS.items():
              data = base64.b64decode(row['base64'], validate=True)
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
              with (material / name).open('xb') as output:
                  assert output.write(data) == len(data)
          keep = ('GITHUB_ACTIONS', 'RUNNER_OS', 'RUNNER_ENVIRONMENT', 'GITHUB_REPOSITORY',
                  'GITHUB_EVENT_NAME', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_WORKFLOW_SHA', 'GITHUB_REF')
          env = {name: os.environ[name] for name in keep}
          env.update(RUNNER_TEMP=str(root), PATH='/usr/bin:/bin', HOME=str(material),
                     TMPDIR=str(material), LANG='C', LC_ALL='C', PYTHONUNBUFFERED='1', PYTHONNOUSERSITE='1')
          # Replace this fixed bootstrap, do not add an unbounded subprocess wrapper.
          os.execve(sys.executable, [sys.executable, '-I', '-S', str(material / 'driver.py')], env)
          PY
