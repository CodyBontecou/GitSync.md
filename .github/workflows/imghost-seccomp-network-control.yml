name: imghost finite unprivileged network controls
on:
  push:
    branches: ['prep/qualification/imghost-seccomp-control-20261006']
    paths: ['.github/workflows/imghost-seccomp-network-control.yml']
permissions:
  contents: read
concurrency:
  group: imghost-seccomp-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finite-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize hash-pinned finite controls without checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,hashlib
          root=Path(os.environ['RUNNER_TEMP'])/'seccomp-network-bootstrap'
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          materials={'control.py': '', 'driver.py': '', 'owned_runner.py': ''}
          digests={'control.py': 'ca1ea8ac683095c7769fb1b668db8cae22d99a9f893f69ba9d2b7641e3a1b6e8', 'driver.py': 'bad797211f77d656ad9e853cea976947ca0e940599673a3dccf6be0ce67df6bf', 'owned_runner.py': '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'}
          for name,value in materials.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==digests[name]
              with (root/name).open('xb') as f: f.write(raw)
          PY
      - name: Qualify finite process-self filter controls only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/seccomp-network-bootstrap/driver.py"
