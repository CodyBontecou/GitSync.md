name = "sync-md-onboarding-analytics"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 database created in Cloudflare account via:
#   wrangler d1 create sync-md-onboarding-analytics
[[d1_databases]]
binding = "DB"
database_name = "sync-md-onboarding-analytics"
database_id = "500637ab-9d1d-4660-8291-763962b4e126"

[vars]
# This worker deliberately does not store IP addresses, user agents, request URLs,
# repo URLs, file paths, branch names, author names/emails, tokens, SSH keys,
# folder names, or file contents.
MAX_BATCH_SIZE = "50"

# Optional ingest token. If configured later:
#   wrangler secret put INGEST_TOKEN
# If unset, requests are accepted without Authorization after schema validation.
