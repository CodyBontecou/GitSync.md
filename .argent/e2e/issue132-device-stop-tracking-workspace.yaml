# Issue #132 on a physical iPhone: stop tracking Obsidian's workspace files
# from the Git tab suggestion, then push the commit to GitHub.
# Prerequisites: a Debug build of GitSync.md on the owner's own iPhone, signed in
# to GitHub, with the owner's private QA repo `gitsync-tide-qa` added as a vault,
# in sync, and with exactly two tracked .obsidian/workspace*.json files (fake
# content, no personal data). Run with `--device <iPhone udid>`; a physical
# phone is never auto-selected. Never use the -UITestGitToolsFixture launch
# argument on a real phone: it can wipe the saved vault list.
# Side effects: makes and PUSHES one commit to gitsync-tide-qa that removes the
# workspace files from Git and adds `/.obsidian/workspace*.json` to .gitignore.
# To run it again, revert that commit on GitHub and Pull on the phone first.
# No coordinate steps: on device the runner tree is the describe tree.
version: 1
requires:
  platform: ios
steps:
  - echo: Relaunch GitSync.md. Expect Home with the gitsync-tide-qa test vault
      (tracked .obsidian/workspace*.json files)
  - launch: bontecou.Sync-md
  - await:
      visible:
        id: home.vault.gitsync-tide-qa
      timeout: 20000
  - await: { idle: true }
  - tap:
      id: home.vault.gitsync-tide-qa
  - await:
      visible:
        id: vault.title
      timeout: 10000
  - await: { idle: true }
  - echo: Vault open and in sync. Open the Git tab; expect the workspace-file
      suggestion with plural wording
  - tap:
      text: Git
  - await:
      visible:
        id: git.stopTrackingWorkspace
      timeout: 10000
  - await: { idle: true }
  - assert:
      visible:
        text: 2 Obsidian workspace files are tracked
  - assert:
      visible:
        text: Stop tracking them to keep them on each device only
  - tap:
      id: git.stopTrackingWorkspace
  - await:
      visible:
        id: stopTracking.confirm
      timeout: 5000
  - await: { idle: true }
  - assert:
      visible:
        id: stopTracking.option.workspace
  - assert:
      text:
        in:
          id: stopTracking.otherDevicesNote
        contains: Git deletes their copy. Obsidian creates a new one
  - echo: Sheet fully exposed (title, option, other-devices note, confirm). Confirm;
      expect a commit waiting to push and the suggestion gone
  - tap:
      id: stopTracking.confirm
  - await:
      hidden:
        id: stopTracking.confirm
      timeout: 15000
  - await:
      visible:
        text: 1 to push, Committed, not pushed yet
      timeout: 10000
  - assert:
      hidden:
        id: git.stopTrackingWorkspace
  - echo: Commit waiting and suggestion gone. Tap Push; expect the vault back in
      sync with GitHub
  - tap:
      text: Push
  - await:
      visible:
        text: In sync, Nothing waiting on this iPhone
      timeout: 45000
