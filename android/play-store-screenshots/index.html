<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Store Screenshot Generator</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="config.js"></script>

  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115;
      color: #fff;
    }

    #topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 12, 16, 0.9);
      backdrop-filter: blur(8px);
    }

    #topbar .left,
    #topbar .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #app-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    #locale-select {
      background: #1c2230;
      color: #fff;
      border: 1px solid #33405c;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }

    #export-btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    #export-btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #slide-grid {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      min-height: calc(100vh - 52px);
    }

    .slide-wrap,
    .fg-wrap {
      position: relative;
      flex: 0 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      background: #111;
    }

    .slide,
    .feature-graphic {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      transform-origin: top left;
      font-family: Inter, system-ui, sans-serif;
    }

    .slide::after,
    .feature-graphic::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.03;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      pointer-events: none;
      z-index: 1;
    }

    .phone-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 4;
    }

    #export-canvases {
      position: fixed;
      left: -9999px;
      top: 0;
      z-index: -1;
    }

    .error-layout {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      background: #ef4444;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="left">
      <div id="app-name">Play Store Screenshot Generator</div>
      <select id="locale-select"></select>
    </div>
    <div class="right">
      <button id="export-btn">Export ZIP</button>
    </div>
  </div>

  <div id="slide-grid"></div>
  <div id="export-canvases"></div>

  <script>
    const PHONE_W = 1080;
    const PHONE_H = 1920;
    const TAB7_W = 1200;
    const TAB7_H = 1920;
    const TAB10_W = 1600;
    const TAB10_H = 2560;
    const FG_W = 1024;
    const FG_H = 500;
    const TOPBAR_H = 52;

    const RTL_LOCALES = new Set(["ar", "he", "fa", "ur"]);

    const THEMES = {
      "clean-light": {
        bg: "#FFFFFF",
        fg: "#111111",
        accent: config.brand.primary,
        muted: "#666666",
        surface: "#F4F4F8",
      },
      "dark-bold": {
        bg: "#0A0A0A",
        fg: "#FFFFFF",
        accent: config.brand.accent,
        muted: "#999999",
        surface: "#1A1A1A",
      },
      "vibrant": {
        bg: config.brand.primary,
        fg: "#FFFFFF",
        accent: config.brand.accent,
        muted: "rgba(255,255,255,0.7)",
        surface: config.brand.secondary,
      },
      "editorial": {
        bg: "#F8F5F0",
        fg: "#1A1A1A",
        accent: config.brand.primary,
        muted: "#7A7A7A",
        surface: "#EDE9E3",
      },
    };

    const theme = THEMES[config.theme] || THEMES["clean-light"];

    const localeSelect = document.getElementById("locale-select");
    const slideGrid = document.getElementById("slide-grid");
    const exportCanvases = document.getElementById("export-canvases");
    const exportBtn = document.getElementById("export-btn");

    function typography(W) {
      return {
        label: W * 0.026,
        headline: W * 0.09,
        headlineLg: W * 0.1,
        subtext: W * 0.036,
        appName: W * 0.03,
      };
    }

    const nl2br = (text) => String(text || "").replace(/\\n|\n/g, "<br>");

    function valueForLocale(value, locale) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        return value[locale] ?? value.en ?? Object.values(value)[0] ?? "";
      }
      return value ?? "";
    }

    function hexToRgb(hex) {
      const m = String(hex || "").replace("#", "");
      if (m.length !== 6) return { r: 10, g: 132, b: 255 };
      return {
        r: parseInt(m.slice(0, 2), 16),
        g: parseInt(m.slice(2, 4), 16),
        b: parseInt(m.slice(4, 6), 16),
      };
    }

    function rgba(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function isDarkTheme() {
      return config.theme === "dark-bold" || config.theme === "vibrant";
    }

    function createBackgroundLayer(W, H) {
      const layer = document.createElement("div");
      layer.style.position = "absolute";
      layer.style.inset = "0";
      layer.style.zIndex = "0";

      if (isDarkTheme()) {
        layer.style.background = `linear-gradient(160deg, #080c15 0%, ${rgba(config.brand.primary, 0.3)} 45%, #06080f 100%)`;
      } else if (config.theme === "editorial") {
        layer.style.background = `linear-gradient(155deg, ${config.brand.background} 0%, ${rgba(config.brand.primary, 0.12)} 100%)`;
      } else {
        layer.style.background = `linear-gradient(155deg, ${config.brand.background} 0%, ${rgba(config.brand.primary, 0.1)} 100%)`;
      }

      const orbTop = document.createElement("div");
      orbTop.className = "orb";
      orbTop.style.width = `${W * 0.72}px`;
      orbTop.style.height = `${W * 0.72}px`;
      orbTop.style.left = "50%";
      orbTop.style.top = `${-W * 0.08}px`;
      orbTop.style.transform = "translateX(-50%)";
      orbTop.style.background = `radial-gradient(circle, ${rgba(config.brand.primary, 1)} 0%, transparent 70%)`;
      orbTop.style.opacity = isDarkTheme() ? "0.32" : "0.12";

      const orbBottom = document.createElement("div");
      orbBottom.className = "orb";
      orbBottom.style.width = `${W * 0.95}px`;
      orbBottom.style.height = `${W * 0.95}px`;
      orbBottom.style.left = "50%";
      orbBottom.style.top = `${H * 0.35}px`;
      orbBottom.style.transform = "translateX(-50%)";
      orbBottom.style.background = `radial-gradient(circle, ${rgba(config.brand.secondary, 1)} 0%, transparent 70%)`;
      orbBottom.style.opacity = isDarkTheme() ? "0.24" : "0.1";

      layer.appendChild(orbTop);
      layer.appendChild(orbBottom);
      return layer;
    }

    function createAndroidPhoneMockup({ screenshot, color = "black", width, height }) {
      const palettes = {
        black: { frame: "#1C1C1E", border: "#3A3A3C", screenBg: "#000000", button: "#2c2c2e" },
        white: { frame: "#F2F2F7", border: "#D1D1D6", screenBg: "#FFFFFF", button: "#d1d1d6" },
        silver: { frame: "#8E8E93", border: "#636366", screenBg: "#111111", button: "#7a7a7f" },
      };
      const p = palettes[color] || palettes.black;

      const frame = document.createElement("div");
      frame.style.position = "absolute";
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      frame.style.borderRadius = `${width * 0.12}px`;
      frame.style.background = p.frame;
      frame.style.border = `${Math.max(1, width * 0.008)}px solid ${p.border}`;
      frame.style.boxShadow = isDarkTheme()
        ? "0 28px 88px rgba(0,0,0,0.35), 0 12px 30px rgba(0,0,0,0.2)"
        : "0 24px 80px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.10)";

      const screen = document.createElement("div");
      screen.style.position = "absolute";
      screen.style.left = `${width * 0.03}px`;
      screen.style.top = `${height * 0.025}px`;
      screen.style.width = `${width - width * 0.06}px`;
      screen.style.height = `${height - (height * 0.025 + height * 0.028)}px`;
      screen.style.borderRadius = `${width * 0.085}px`;
      screen.style.overflow = "hidden";
      screen.style.background = p.screenBg;

      const shot = document.createElement("img");
      shot.src = screenshot;
      shot.alt = "App screenshot";
      shot.style.width = "100%";
      shot.style.height = "100%";
      shot.style.objectFit = "cover";
      shot.style.objectPosition = "top center";

      const camera = document.createElement("div");
      camera.style.position = "absolute";
      camera.style.width = `${width * 0.028}px`;
      camera.style.height = `${width * 0.028}px`;
      camera.style.left = "50%";
      camera.style.top = `${height * 0.018}px`;
      camera.style.transform = "translateX(-50%)";
      camera.style.borderRadius = "50%";
      camera.style.background = "#0b0b0c";

      const home = document.createElement("div");
      home.style.position = "absolute";
      home.style.width = `${width * 0.30}px`;
      home.style.height = `${Math.max(2, height * 0.003)}px`;
      home.style.left = "50%";
      home.style.bottom = `${height * 0.014}px`;
      home.style.transform = "translateX(-50%)";
      home.style.borderRadius = "999px";
      home.style.background = rgba("#000000", color === "white" ? 0.25 : 0.5);

      const power = document.createElement("div");
      power.style.position = "absolute";
      power.style.right = `${-width * 0.006}px`;
      power.style.top = `${height * 0.38}px`;
      power.style.width = `${Math.max(2, width * 0.006)}px`;
      power.style.height = `${height * 0.08}px`;
      power.style.borderRadius = "999px";
      power.style.background = p.button;

      const volUp = document.createElement("div");
      volUp.style.position = "absolute";
      volUp.style.left = `${-width * 0.006}px`;
      volUp.style.top = `${height * 0.32}px`;
      volUp.style.width = `${Math.max(2, width * 0.006)}px`;
      volUp.style.height = `${height * 0.06}px`;
      volUp.style.borderRadius = "999px";
      volUp.style.background = p.button;

      const volDown = document.createElement("div");
      volDown.style.position = "absolute";
      volDown.style.left = `${-width * 0.006}px`;
      volDown.style.top = `${height * 0.42}px`;
      volDown.style.width = `${Math.max(2, width * 0.006)}px`;
      volDown.style.height = `${height * 0.06}px`;
      volDown.style.borderRadius = "999px";
      volDown.style.background = p.button;

      screen.appendChild(shot);
      frame.appendChild(screen);
      frame.appendChild(camera);
      frame.appendChild(home);
      frame.appendChild(power);
      frame.appendChild(volUp);
      frame.appendChild(volDown);
      return frame;
    }

    function fitTextBlock(textBlock, headlineEl, subtextEl) {
      // Keep copy inside the top 32% text container.
      // If content overflows, shrink type slightly; hide subtext as last resort.
      let guard = 0;
      while (textBlock.scrollHeight > textBlock.clientHeight && guard < 24) {
        const hSize = parseFloat(getComputedStyle(headlineEl).fontSize || "0");
        if (hSize > 62) {
          headlineEl.style.fontSize = `${hSize * 0.97}px`;
        }

        if (subtextEl) {
          const sSize = parseFloat(getComputedStyle(subtextEl).fontSize || "0");
          if (sSize > 28) {
            subtextEl.style.fontSize = `${sSize * 0.96}px`;
          }
        }

        guard++;
      }

      if (subtextEl && textBlock.scrollHeight > textBlock.clientHeight) {
        subtextEl.style.display = "none";
      }
    }

    function createTextTopSlide(slide, locale, W, H) {
      const s = document.createElement("div");
      s.className = "slide";
      s.style.width = `${W}px`;
      s.style.height = `${H}px`;
      s.style.background = theme.bg;
      s.setAttribute("dir", RTL_LOCALES.has(locale) ? "rtl" : "ltr");

      const screenshot = valueForLocale(slide.screenshot, locale);
      const label = valueForLocale(slide.label, locale);
      const headline = valueForLocale(slide.headline, locale);
      const subtext = valueForLocale(slide.subtext, locale);

      s.appendChild(createBackgroundLayer(W, H));

      if (isDarkTheme()) {
        const glow = document.createElement("div");
        glow.className = "phone-glow";
        glow.style.width = `${W * 0.84}px`;
        glow.style.height = `${W * 0.84}px`;
        glow.style.left = "50%";
        glow.style.top = `${H * 0.37}px`;
        glow.style.transform = "translateX(-50%)";
        glow.style.background = `radial-gradient(circle, ${rgba(config.brand.primary, 0.9)} 0%, transparent 66%)`;
        glow.style.opacity = "0.18";
        s.appendChild(glow);
      }

      // Small brand anchor in top-left so the main headline block has more room.
      const brandAnchor = document.createElement("div");
      brandAnchor.style.position = "absolute";
      brandAnchor.style.left = `${W * 0.06}px`;
      brandAnchor.style.top = `${H * 0.05}px`;
      brandAnchor.style.display = "flex";
      brandAnchor.style.alignItems = "center";
      brandAnchor.style.gap = `${W * 0.012}px`;
      brandAnchor.style.zIndex = "7";

      const appIcon = document.createElement("img");
      appIcon.src = config.app.icon;
      appIcon.alt = "App icon";
      appIcon.style.width = `${W * 0.05}px`;
      appIcon.style.height = `${W * 0.05}px`;
      appIcon.style.borderRadius = `${W * 0.012}px`;
      appIcon.style.objectFit = "cover";
      appIcon.style.boxShadow = isDarkTheme() ? "0 6px 20px rgba(0,0,0,0.35)" : "0 6px 18px rgba(0,0,0,0.16)";

      const appName = document.createElement("div");
      appName.textContent = config.app.name;
      appName.style.fontSize = `${W * 0.022}px`;
      appName.style.fontWeight = "700";
      appName.style.letterSpacing = "0.01em";
      appName.style.color = theme.fg;
      appName.style.opacity = "0.86";

      brandAnchor.appendChild(appIcon);
      brandAnchor.appendChild(appName);

      const textBlock = document.createElement("div");
      textBlock.style.position = "absolute";
      textBlock.style.left = `${W * 0.08}px`;
      textBlock.style.right = `${W * 0.08}px`;
      textBlock.style.top = `${H * 0.108}px`;
      textBlock.style.height = `${H * 0.205}px`;
      textBlock.style.overflow = "hidden";
      textBlock.style.display = "flex";
      textBlock.style.flexDirection = "column";
      textBlock.style.justifyContent = "flex-start";
      textBlock.style.alignItems = "center";
      textBlock.style.textAlign = "center";
      textBlock.style.zIndex = "6";

      const pill = document.createElement("div");
      pill.textContent = String(label || "").toUpperCase();
      pill.style.display = "inline-flex";
      pill.style.alignItems = "center";
      pill.style.padding = `${W * 0.0105}px ${W * 0.028}px`;
      pill.style.borderRadius = "999px";
      pill.style.fontSize = `${W * 0.026}px`;
      pill.style.fontWeight = "700";
      pill.style.letterSpacing = "0.12em";
      pill.style.textTransform = "uppercase";
      pill.style.marginBottom = `${W * 0.018}px`;

      if (isDarkTheme()) {
        pill.style.background = rgba("#FFFFFF", 0.1);
        pill.style.color = "rgba(255,255,255,0.84)";
        pill.style.border = `1.5px solid ${rgba("#FFFFFF", 0.16)}`;
      } else {
        pill.style.background = rgba(config.brand.primary, 0.12);
        pill.style.color = config.brand.primary;
        pill.style.border = `1.5px solid ${rgba(config.brand.primary, 0.25)}`;
      }

      const h = document.createElement("div");
      h.innerHTML = nl2br(headline);
      h.style.fontSize = `${W * 0.084}px`;
      h.style.fontWeight = "800";
      h.style.lineHeight = "1.05";
      h.style.letterSpacing = "-0.02em";
      h.style.color = theme.fg;
      if (isDarkTheme()) {
        h.style.textShadow = "0 4px 40px rgba(0,0,0,0.40)";
      }

      textBlock.appendChild(pill);
      textBlock.appendChild(h);

      let subtextEl = null;
      if (subtext) {
        const p = document.createElement("div");
        p.innerHTML = nl2br(subtext);
        p.style.marginTop = `${W * 0.012}px`;
        p.style.fontSize = `${W * 0.033}px`;
        p.style.lineHeight = "1.22";
        p.style.maxWidth = "92%";
        p.style.color = theme.muted;
        textBlock.appendChild(p);
        subtextEl = p;
      }

      const phoneWidth = W * 0.82;
      const phoneHeight = phoneWidth * 2.15;
      const phoneTop = H * 0.345;
      const phoneLeft = (W - phoneWidth) / 2;

      const phone = createAndroidPhoneMockup({
        screenshot,
        color: config.device?.color || "black",
        width: phoneWidth,
        height: phoneHeight,
      });
      phone.style.left = `${phoneLeft}px`;
      phone.style.top = `${phoneTop}px`;
      phone.style.zIndex = "8";

      s.appendChild(brandAnchor);
      s.appendChild(textBlock);
      fitTextBlock(textBlock, h, subtextEl);
      s.appendChild(phone);

      return s;
    }

    function createFullBleedSlide(slide, locale, W, H) {
      const s = document.createElement("div");
      s.className = "slide";
      s.style.width = `${W}px`;
      s.style.height = `${H}px`;
      s.setAttribute("dir", RTL_LOCALES.has(locale) ? "rtl" : "ltr");

      const t = typography(W);
      const screenshot = valueForLocale(slide.screenshot, locale);
      const label = valueForLocale(slide.label, locale);
      const headline = valueForLocale(slide.headline, locale);

      const bg = document.createElement("img");
      bg.src = screenshot;
      bg.alt = "Full bleed screenshot";
      bg.style.position = "absolute";
      bg.style.inset = "0";
      bg.style.width = "100%";
      bg.style.height = "100%";
      bg.style.objectFit = "cover";

      const overlay = document.createElement("div");
      overlay.style.position = "absolute";
      overlay.style.left = "0";
      overlay.style.top = "0";
      overlay.style.width = "100%";
      overlay.style.height = `${H * 0.4}px`;
      overlay.style.background = "linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.18) 70%, rgba(0,0,0,0) 100%)";

      const text = document.createElement("div");
      text.style.position = "absolute";
      text.style.left = `${W * 0.08}px`;
      text.style.right = `${W * 0.08}px`;
      text.style.top = `${H * 0.075}px`;
      text.style.zIndex = "4";
      text.style.textAlign = "center";

      const pill = document.createElement("div");
      pill.textContent = String(label || "").toUpperCase();
      pill.style.display = "inline-flex";
      pill.style.padding = `${W * 0.0105}px ${W * 0.028}px`;
      pill.style.borderRadius = "999px";
      pill.style.background = rgba("#FFFFFF", 0.16);
      pill.style.color = "rgba(255,255,255,0.95)";
      pill.style.border = `1.5px solid ${rgba("#FFFFFF", 0.2)}`;
      pill.style.fontSize = `${t.label}px`;
      pill.style.fontWeight = "700";
      pill.style.letterSpacing = "0.12em";
      pill.style.marginBottom = `${W * 0.024}px`;

      const h = document.createElement("div");
      h.innerHTML = nl2br(headline);
      h.style.fontSize = `${t.headline}px`;
      h.style.fontWeight = "800";
      h.style.lineHeight = "1.05";
      h.style.letterSpacing = "-0.02em";
      h.style.color = "#fff";
      h.style.textShadow = "0 4px 40px rgba(0,0,0,0.48)";

      text.appendChild(pill);
      text.appendChild(h);

      s.appendChild(bg);
      s.appendChild(overlay);
      s.appendChild(text);
      return s;
    }

    function createPhoneSlide(slide, locale, W, H) {
      const layout = slide.layout || "text-top";
      if (layout === "text-top") return createTextTopSlide(slide, locale, W, H);
      if (layout === "full-bleed") return createFullBleedSlide(slide, locale, W, H);

      const s = document.createElement("div");
      s.className = "slide";
      s.style.width = `${W}px`;
      s.style.height = `${H}px`;
      s.style.background = "#fff";
      const err = document.createElement("div");
      err.className = "error-layout";
      err.textContent = `Unsupported layout: ${layout}`;
      s.appendChild(err);
      return s;
    }

    function createFeatureGraphic(locale) {
      const fg = document.createElement("div");
      fg.className = "feature-graphic";
      fg.style.width = `${FG_W}px`;
      fg.style.height = `${FG_H}px`;
      fg.id = "feature-graphic-canvas";

      const style = config.featureGraphic?.style || "gradient";
      const headline = valueForLocale(config.featureGraphic?.headline, locale);
      const subtext = valueForLocale(config.featureGraphic?.subtext, locale) || "Available on Google Play";
      const appName = valueForLocale(config.app?.name, locale);
      const icon = valueForLocale(config.app?.icon, locale);
      const screenshot = valueForLocale(config.featureGraphic?.screenshot, locale) || valueForLocale(config.slides[0]?.screenshot, locale);

      fg.style.background = config.brand.background;

      if (style === "gradient") {
        fg.style.background = `linear-gradient(120deg, ${config.brand.primary} 0%, ${config.brand.secondary} 100%)`;

        const orb1 = document.createElement("div");
        orb1.className = "orb";
        orb1.style.width = "320px";
        orb1.style.height = "320px";
        orb1.style.left = "-40px";
        orb1.style.top = "-80px";
        orb1.style.filter = "blur(80px)";
        orb1.style.background = `radial-gradient(circle, ${rgba("#FFFFFF", 0.4)} 0%, transparent 72%)`;

        const orb2 = document.createElement("div");
        orb2.className = "orb";
        orb2.style.width = "260px";
        orb2.style.height = "260px";
        orb2.style.right = "80px";
        orb2.style.bottom = "-50px";
        orb2.style.filter = "blur(80px)";
        orb2.style.background = `radial-gradient(circle, ${rgba(config.brand.primary, 0.9)} 0%, transparent 70%)`;

        fg.appendChild(orb1);
        fg.appendChild(orb2);

        const content = document.createElement("div");
        content.style.position = "absolute";
        content.style.inset = "0";
        content.style.display = "flex";
        content.style.alignItems = "center";
        content.style.gap = "34px";
        content.style.padding = "0 58px";
        content.style.color = "#fff";
        content.style.zIndex = "5";

        const iconEl = document.createElement("img");
        iconEl.src = icon;
        iconEl.alt = "App icon";
        iconEl.style.width = "180px";
        iconEl.style.height = "180px";
        iconEl.style.borderRadius = "36px";
        iconEl.style.objectFit = "cover";
        iconEl.style.boxShadow = "0 12px 40px rgba(0,0,0,0.3)";

        const textWrap = document.createElement("div");
        textWrap.style.flex = "1";

        const n = document.createElement("div");
        n.textContent = appName;
        n.style.fontSize = `${FG_W * 0.03}px`;
        n.style.fontWeight = "700";
        n.style.opacity = "0.95";
        n.style.marginBottom = "10px";

        const h = document.createElement("div");
        h.textContent = headline;
        h.style.fontSize = `${FG_W * 0.058}px`;
        h.style.fontWeight = "800";
        h.style.lineHeight = "1.08";
        h.style.letterSpacing = "-0.02em";
        h.style.marginBottom = "10px";

        const p = document.createElement("div");
        p.textContent = subtext;
        p.style.fontSize = `${FG_W * 0.024}px`;
        p.style.opacity = "0.92";

        textWrap.appendChild(n);
        textWrap.appendChild(h);
        textWrap.appendChild(p);
        content.appendChild(iconEl);
        content.appendChild(textWrap);
        fg.appendChild(content);
      } else if (style === "solid") {
        fg.style.background = config.brand.background;

        const line = document.createElement("div");
        line.style.position = "absolute";
        line.style.top = "80px";
        line.style.left = "50%";
        line.style.transform = "translateX(-50%)";
        line.style.width = "220px";
        line.style.height = "4px";
        line.style.borderRadius = "999px";
        line.style.background = config.brand.primary;

        const iconEl = document.createElement("img");
        iconEl.src = icon;
        iconEl.style.position = "absolute";
        iconEl.style.width = "148px";
        iconEl.style.height = "148px";
        iconEl.style.left = "50%";
        iconEl.style.top = "104px";
        iconEl.style.transform = "translateX(-50%)";
        iconEl.style.borderRadius = "30px";

        const h = document.createElement("div");
        h.textContent = headline;
        h.style.position = "absolute";
        h.style.left = "50%";
        h.style.top = "282px";
        h.style.transform = "translateX(-50%)";
        h.style.fontSize = `${FG_W * 0.052}px`;
        h.style.fontWeight = "800";
        h.style.color = config.brand.text;
        h.style.textAlign = "center";

        const p = document.createElement("div");
        p.textContent = subtext;
        p.style.position = "absolute";
        p.style.left = "50%";
        p.style.top = "352px";
        p.style.transform = "translateX(-50%)";
        p.style.fontSize = `${FG_W * 0.024}px`;
        p.style.color = config.brand.textMuted;

        fg.appendChild(line);
        fg.appendChild(iconEl);
        fg.appendChild(h);
        fg.appendChild(p);
      } else {
        const shot = document.createElement("img");
        shot.src = screenshot;
        shot.style.position = "absolute";
        shot.style.right = "0";
        shot.style.top = "0";
        shot.style.width = "55%";
        shot.style.height = "100%";
        shot.style.objectFit = "cover";

        const left = document.createElement("div");
        left.style.position = "absolute";
        left.style.left = "0";
        left.style.top = "0";
        left.style.width = "50%";
        left.style.height = "100%";
        left.style.background = config.brand.primary;

        const fade = document.createElement("div");
        fade.style.position = "absolute";
        fade.style.left = "44%";
        fade.style.top = "0";
        fade.style.width = "20%";
        fade.style.height = "100%";
        fade.style.background = `linear-gradient(90deg, ${config.brand.primary} 0%, ${rgba(config.brand.primary, 0)} 100%)`;

        const iconEl = document.createElement("img");
        iconEl.src = icon;
        iconEl.style.position = "absolute";
        iconEl.style.left = "64px";
        iconEl.style.top = "78px";
        iconEl.style.width = "126px";
        iconEl.style.height = "126px";
        iconEl.style.borderRadius = "26px";

        const h = document.createElement("div");
        h.textContent = headline;
        h.style.position = "absolute";
        h.style.left = "64px";
        h.style.top = "230px";
        h.style.maxWidth = "390px";
        h.style.fontSize = `${FG_W * 0.048}px`;
        h.style.fontWeight = "800";
        h.style.lineHeight = "1.1";
        h.style.color = "#fff";

        const p = document.createElement("div");
        p.textContent = subtext;
        p.style.position = "absolute";
        p.style.left = "64px";
        p.style.top = "355px";
        p.style.fontSize = `${FG_W * 0.024}px`;
        p.style.color = "rgba(255,255,255,0.9)";

        fg.appendChild(shot);
        fg.appendChild(left);
        fg.appendChild(fade);
        fg.appendChild(iconEl);
        fg.appendChild(h);
        fg.appendChild(p);
      }

      return fg;
    }

    function getSelectedLocale() {
      return localeSelect.value || config.locales[0] || "en";
    }

    function renderPreview() {
      const locale = getSelectedLocale();
      slideGrid.innerHTML = "";

      config.slides.forEach((slide) => {
        const wrap = document.createElement("div");
        wrap.className = "slide-wrap";
        wrap.dataset.type = "phone";

        const canvas = createPhoneSlide(slide, locale, PHONE_W, PHONE_H);
        canvas.id = `preview-${locale}-${slide.id}`;

        wrap.appendChild(canvas);
        slideGrid.appendChild(wrap);
      });

      const fgWrap = document.createElement("div");
      fgWrap.className = "fg-wrap";
      fgWrap.dataset.type = "fg";

      const fg = createFeatureGraphic(locale);
      fg.id = `preview-${locale}-feature-graphic`;

      fgWrap.appendChild(fg);
      slideGrid.appendChild(fgWrap);

      applyPreviewScale();
    }

    function applyPreviewScale() {
      const slideCount = config.slides.length;
      const SCALE = Math.min(
        (window.innerHeight - TOPBAR_H - 64) / PHONE_H,
        (window.innerWidth - 80) / (PHONE_W * slideCount + 20 * Math.max(0, slideCount - 1))
      );

      document.querySelectorAll(".slide-wrap").forEach((wrap) => {
        wrap.style.width = `${PHONE_W * SCALE}px`;
        wrap.style.height = `${PHONE_H * SCALE}px`;
        const slide = wrap.firstElementChild;
        slide.style.transform = `scale(${SCALE})`;
      });

      document.querySelectorAll(".fg-wrap").forEach((wrap) => {
        const fgScale = (PHONE_H * SCALE) / FG_H;
        wrap.style.width = `${FG_W * fgScale}px`;
        wrap.style.height = `${FG_H * fgScale}px`;
        const fg = wrap.firstElementChild;
        fg.style.transform = `scale(${fgScale})`;
      });
    }

    function renderExportCanvases() {
      exportCanvases.innerHTML = "";

      for (const locale of config.locales) {
        for (const slide of config.slides) {
          const canvas = createPhoneSlide(slide, locale, PHONE_W, PHONE_H);
          canvas.id = `canvas-${locale}-${slide.id}`;
          canvas.style.position = "fixed";
          canvas.style.left = "-9999px";
          canvas.style.top = "0";
          canvas.style.zIndex = "-1";
          exportCanvases.appendChild(canvas);
        }

        const fg = createFeatureGraphic(locale);
        fg.id = `canvas-${locale}-feature-graphic`;
        fg.style.position = "fixed";
        fg.style.left = "-9999px";
        fg.style.top = "0";
        fg.style.zIndex = "-1";
        exportCanvases.appendChild(fg);

        if (config.tablet && config.tablet.enabled) {
          for (const size of config.tablet.sizes || []) {
            const W = size === "10-inch" ? TAB10_W : TAB7_W;
            const H = size === "10-inch" ? TAB10_H : TAB7_H;
            for (const slide of config.slides) {
              const tab = createPhoneSlide(slide, locale, W, H);
              tab.id = `canvas-tablet-${size}-${locale}-${slide.id}`;
              tab.style.position = "fixed";
              tab.style.left = "-9999px";
              tab.style.top = "0";
              tab.style.zIndex = "-1";
              exportCanvases.appendChild(tab);
            }
          }
        }
      }
    }

    async function captureSlide(element) {
      const prev = {
        left: element.style.left,
        top: element.style.top,
        position: element.style.position,
        zIndex: element.style.zIndex,
      };

      element.style.left = "0px";
      element.style.top = "0px";
      element.style.position = "fixed";
      element.style.zIndex = "9999";

      const bg = getComputedStyle(element).backgroundColor || "#ffffff";

      await htmlToImage.toPng(element, {
        pixelRatio: 1,
        cacheBust: true,
        backgroundColor: bg,
      });

      const dataUrl = await htmlToImage.toPng(element, {
        pixelRatio: 1,
        cacheBust: true,
        backgroundColor: bg,
      });

      element.style.left = prev.left || "-9999px";
      element.style.top = prev.top || "0px";
      element.style.position = prev.position || "fixed";
      element.style.zIndex = prev.zIndex || "-1";

      await new Promise((r) => setTimeout(r, 200));
      return dataUrl;
    }

    async function exportAll() {
      exportBtn.disabled = true;
      exportBtn.textContent = "Exporting…";

      try {
        const zip = new JSZip();
        const phoneFolder = zip.folder("phone");
        const fgFolder = zip.folder("feature-graphic");

        for (const locale of config.locales) {
          const localeFolder = phoneFolder.folder(locale);

          for (let i = 0; i < config.slides.length; i++) {
            const slide = config.slides[i];
            const el = document.getElementById(`canvas-${locale}-${slide.id}`);
            if (!el) continue;
            const name = `${String(i + 1).padStart(2, "0")}-${slide.id}-${PHONE_W}x${PHONE_H}.png`;
            const dataUrl = await captureSlide(el);
            localeFolder.file(name, dataUrl.split(",")[1], { base64: true });
          }

          const fg = document.getElementById(`canvas-${locale}-feature-graphic`);
          if (fg) {
            const fgData = await captureSlide(fg);
            const fgName = config.locales.length > 1
              ? `feature-graphic-${locale}-${FG_W}x${FG_H}.png`
              : `feature-graphic-${FG_W}x${FG_H}.png`;
            fgFolder.file(fgName, fgData.split(",")[1], { base64: true });
          }

          if (config.tablet && config.tablet.enabled) {
            for (const size of config.tablet.sizes || []) {
              const W = size === "10-inch" ? TAB10_W : TAB7_W;
              const H = size === "10-inch" ? TAB10_H : TAB7_H;
              const tabFolder = zip.folder(`tablet-${size}/${locale}`);

              for (let i = 0; i < config.slides.length; i++) {
                const slide = config.slides[i];
                const el = document.getElementById(`canvas-tablet-${size}-${locale}-${slide.id}`);
                if (!el) continue;
                const name = `${String(i + 1).padStart(2, "0")}-${slide.id}-${W}x${H}.png`;
                const dataUrl = await captureSlide(el);
                tabFolder.file(name, dataUrl.split(",")[1], { base64: true });
              }
            }
          }
        }

        const appSlug = String(config.app?.name || "app")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-]/g, "");

        const blob = await zip.generateAsync({ type: "blob" });
        saveAs(blob, `${appSlug || "app"}-play-store-screenshots.zip`);
      } catch (err) {
        console.error(err);
        alert(`Export failed: ${err.message || err}`);
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = "Export ZIP";
      }
    }

    function initLocaleSelect() {
      const locales = config.locales && config.locales.length ? config.locales : ["en"];
      localeSelect.innerHTML = "";

      for (const locale of locales) {
        const option = document.createElement("option");
        option.value = locale;
        option.textContent = locale.toUpperCase();
        localeSelect.appendChild(option);
      }

      localeSelect.style.display = locales.length > 1 ? "inline-block" : "none";
      localeSelect.value = locales[0];
    }

    function boot() {
      initLocaleSelect();
      renderPreview();
      renderExportCanvases();

      localeSelect.addEventListener("change", () => {
        renderPreview();
      });

      exportBtn.addEventListener("click", exportAll);
      window.addEventListener("resize", applyPreviewScale);
    }

    boot();
  </script>
</body>
</html>
